<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flugbuchung</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
    h1 { color: #333; }
    label, select, input { display: block; margin: 10px 0 5px; width: 100%; max-width: 400px; }
    .sitzplan { display: grid; grid-template-columns: repeat(6, 50px); gap: 10px; margin-top: 10px; }
    .sitz { width: 50px; height: 50px; background-color: #ddd; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 14px; border: 1px solid #999; }
    .belegt { background-color: #ff6347; cursor: not-allowed; }
    .frei { background-color: #90ee90; }
    .extra-beinfreiheit { background-color: #87cefa; }
    .premium { background-color: #f5a623; }
    .ausgewaehlt { border: 3px solid black; }
    #preisInfo { margin-top: 20px; font-weight: bold; }
    .card-inputs { margin-top: 20px; max-width: 400px; position: relative; }
    .card-logo-wrap { height: 32px; margin-top: 6px; display: flex; align-items: center; gap: 8px; min-height: 32px; }
    .card-logo-wrap svg { height: 28px; width: auto; }
    .card-logo-wrap span { font-size: 13px; color: #666; }
    .status { padding: 10px; border-radius: 6px; margin: 15px 0; display: none; }
    .status.error { display: block; background: #ffe0e0; color: #a00; }
    .status.ok { display: block; background: #d9f7d9; color: #1a6b1a; }
    #buchungsListe { margin-top: 20px; font-size: 14px; }
  </style>
</head>
<body>

<h1>Flugbuchung</h1>
<div id="statusBox" class="status"></div>

<form id="buchungsForm">
  <fieldset>
    <legend>Persönliche Daten</legend>
    <label for="vorname">Vorname:</label>
    <input type="text" id="vorname" required>
    <label for="nachname">Nachname:</label>
    <input type="text" id="nachname" required>
    <label for="email">E-Mail:</label>
    <input type="email" id="email" required>
  </fieldset>

  <fieldset>
    <legend>Flugdaten</legend>
    <label for="abflughafen">Abflughafen:</label>
    <select id="abflughafen" required>
      <option value="">Bitte wählen</option>
      <option value="FRA">Frankfurt</option>
      <option value="MUC">München</option>
      <option value="VIE">Wien</option>
      <option value="ZRH">Zürich</option>
    </select>

    <label for="flugdatum">Flugdatum:</label>
    <input type="date" id="flugdatum" required>

    <label for="abflugzeit">Abflugzeit:</label>
    <select id="abflugzeit" required></select>

    <label for="zielflughafen">Zielflughafen:</label>
    <select id="zielflughafen" required>
      <option value="BER">Berlin</option>
      <option value="JFK">New York</option>
      <option value="NRT">Tokyo</option>
      <option value="CDG">Paris</option>
      <option value="FNJ">Pjöngjang</option>
    </select>

    <label for="service">Zusatzoptionen:</label>
    <select id="service">
      <option value="keine">Keine</option>
      <option value="frueh">Früh Einsteigen (+10€)</option>
      <option value="schnell">Schnell Aussteigen (+10€)</option>
    </select>

    <p><strong>Flugnummer:</strong> <span id="flugnummer">---</span></p>
  </fieldset>

  <fieldset>
    <legend>Sitzplatz wählen</legend>
    <div class="sitzplan" id="sitzplan"></div>
    <div id="buchungsListe"></div>
    <input type="hidden" id="sitzplatzHidden" />
  </fieldset>

  <fieldset>
    <legend>Zahlungsinformationen</legend>
    <div class="card-inputs">
      <label for="karteninhaber">Karteninhaber:</label>
      <input type="text" id="karteninhaber" required>

      <label for="kartennummer">Kartennummer:</label>
      <input type="text" id="kartennummer" maxlength="19" placeholder="1234 5678 9012 3456" inputmode="numeric" required>
      <div id="kartenlogo" class="card-logo-wrap"><span>Kartentyp wird erkannt</span></div>

      <label for="gueltigkeit">Gültigkeit (MM/YY):</label>
      <input type="text" id="gueltigkeit" placeholder="MM/YY" required>

      <label for="cvc">CVC:</label>
      <input type="text" id="cvc" maxlength="4" placeholder="123" required>
    </div>
  </fieldset>

  <div id="preisInfo">Gesamtpreis: 150 €</div>
  <button type="submit" id="submitBtn">Buchung abschließen</button>
</form>

<div id="buchungsBestaetigung" style="display:none;">
  <h2>Buchung abgeschlossen!</h2>
  <pre id="buchungsDetails"></pre>
  <button onclick="location.reload()">Neue Buchung</button>
</div>

<div style="margin-top: 20px;">
  <strong>Legende:</strong><br />
  <span style="background-color:#90ee90; padding:4px;">Frei</span>
  <span style="background-color:#ff6347; padding:4px; margin-left:10px;">Belegt</span>
  <span style="background-color:#87cefa; padding:4px; margin-left:10px;">Extra Beinfreiheit</span>
  <span style="background-color:#f5a623; padding:4px; margin-left:10px;">Premium</span>
</div>

<script>
  // === HIER EINTRAGEN ===
  const SUPABASE_URL = 'https://cduvaqzdubttasqlwtmg.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Pkmbe8_Xxfa_dK8AnbMyBA_oN8MV8SS';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const sitzplan = document.getElementById('sitzplan');
  const selected = { sitz: null };
  const basispreis = 150;
  let belegteSitze = new Set();
  let buchungenAktuell = [];

  // --- KEIN Math.random mehr: Deterministische Flugnummer ---
  // Gleicher Flug (Route + Datum + Zeit) = immer gleiche Flugnummer
  function hashString(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return Math.abs(h);
  }
  function getFlugnummer() {
    const abflug = document.getElementById('abflughafen').value;
    const ziel = document.getElementById('zielflughafen').value;
    const datum = document.getElementById('flugdatum').value;
    const zeit = document.getElementById('abflugzeit').value;
    if (!abflug || !ziel) return '---';
    const airlineMap = { 'FRA': 'LH', 'MUC': 'LH', 'VIE': 'OS', 'ZRH': 'LX' };
    const code = airlineMap[abflug] || 'LH';
    // Deterministisch aus Route + Datum + Zeit
    const hash = hashString(`${abflug}-${ziel}-${datum}-${zeit}`);
    const nummer = 1000 + (hash % 9000);
    return `${code}${nummer}`;
  }
  function updateFlugnummer() {
    const fn = getFlugnummer();
    document.getElementById('flugnummer').textContent = fn;
    if (fn !== '---') ladeBuchungen();
  }

  function generiereAbflugzeiten() {
    const select = document.getElementById('abflugzeit');
    for (let h = 0; h < 24; h++) {
      const opt = document.createElement('option');
      opt.value = opt.textContent = String(h).padStart(2, '0') + ':30';
      select.appendChild(opt);
    }
  }

  function getSitzTyp(reihe) {
    if (reihe < 3) return 'premium';
    if (reihe >= 10 && reihe <= 12) return 'extra-beinfreiheit';
    return 'normal';
  }

  function getPreisWert() {
    let zuschlag = 0;
    if (selected.sitz) {
      const reihe = parseInt(selected.sitz.slice(0, -1));
      const typ = getSitzTyp(reihe);
      if (typ === 'premium') zuschlag += 50;
      else if (typ === 'extra-beinfreiheit') zuschlag += 30;
    }
    if (document.getElementById('service').value !== 'keine') zuschlag += 10;
    return basispreis + zuschlag;
  }
  function berechnePreis() {
    document.getElementById('preisInfo').textContent = `Gesamtpreis: ${getPreisWert()} €`;
  }

  // --- Supabase: Belegte Sitze laden ---
  async function ladeBuchungen() {
    const flugnummer = getFlugnummer();
    const datum = document.getElementById('flugdatum').value;
    if (!datum || flugnummer === '---') { erstelleSitzplan(); return; }
    const { data, error } = await supabaseClient
      .from('bookings')
      .select('sitzplatz, vorname, nachname')
      .eq('flugdatum', datum)
      .eq('flugnummer', flugnummer);
    if (error) { showStatus('Fehler beim Laden der Buchungen: ' + error.message, true); return; }
    buchungenAktuell = data || [];
    belegteSitze = new Set(buchungenAktuell.map(b => b.sitzplatz));
    erstelleSitzplan();
    renderBuchungsListe();
  }

  function renderBuchungsListe() {
    const el = document.getElementById('buchungsListe');
    if (!buchungenAktuell.length) { el.innerHTML = '<p>Noch keine Buchungen für diesen Flug.</p>'; return; }
    el.innerHTML = `<p><strong>Bereits gebucht (${buchungenAktuell.length}):</strong></p><ul>` +
      buchungenAktuell.map(b => `<li>${b.sitzplatz} – ${b.vorname} ${b.nachname}</li>`).join('') + `</ul>`;
  }

  function erstelleSitzplan() {
    sitzplan.innerHTML = '';
    for (let reihe = 1; reihe <= 15; reihe++) {
      ['A','B','C','D','E','F'].forEach(buchstabe => {
        const id = `${reihe}${buchstabe}`;
        const div = document.createElement('div');
        div.classList.add('sitz');
        div.textContent = id;
        if (belegteSitze.has(id)) {
          div.classList.add('belegt');
          div.title = 'Bereits gebucht';
        } else {
          const typ = getSitzTyp(reihe);
          div.classList.add(typ === 'premium' ? 'premium' : typ === 'extra-beinfreiheit' ? 'extra-beinfreiheit' : 'frei');
          div.onclick = () => {
            document.querySelector('.ausgewaehlt')?.classList.remove('ausgewaehlt');
            selected.sitz = id;
            div.classList.add('ausgewaehlt');
            document.getElementById('sitzplatzHidden').value = id;
            berechnePreis();
          };
        }
        sitzplan.appendChild(div);
      });
    }
  }

  // --- Credit Card Logo FIX: Inline SVG, kein externes Bild ---
   const LOGOS = {
    visa: `<svg viewBox="0 0 48 30" width="48" height="30"><rect width="48" height="30" rx="4" fill="#fff" stroke="#ddd"/><text x="24" y="20" text-anchor="middle" font-family="Arial" font-weight="900" font-style="italic" font-size="13" fill="#1A1F71">VISA</text></svg><span>Visa</span>`,
    mastercard: `<svg viewBox="0 0 48 30" width="48" height="30"><rect width="48" height="30" rx="4" fill="#fff" stroke="#ddd"/><circle cx="20" cy="15" r="9" fill="#EB001B"/><circle cx="28" cy="15" r="9" fill="#F79E1B" fill-opacity="0.85"/></svg><span>Mastercard</span>`,
    amex: `<svg viewBox="0 0 48 30" width="48" height="30"><rect width="48" height="30" rx="4" fill="#2E77BC"/><text x="24" y="19" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="10" fill="#fff">AMEX</text></svg><span>American Express</span>`
  };
  function zeigeKartenlogo() {
    const input = document.getElementById('kartennummer');
    let v = input.value.replace(/\D/g, '').slice(0, 16);
    input.value = v.replace(/(.{4})/g, '$1 ').trim();
    const nummer = v;
    const box = document.getElementById('kartenlogo');
        if (/^4/.test(nummer)) box.innerHTML = LOGOS.visa;
    else if (/^5[1-5]/.test(nummer)) box.innerHTML = LOGOS.mastercard;
    else if (/^3[47]/.test(nummer)) box.innerHTML = LOGOS.amex;
    else box.innerHTML = '<span>Kartentyp wird erkannt</span>';
  }

  function showStatus(msg, isError) {
    const el = document.getElementById('statusBox');
    el.textContent = msg;
    el.className = 'status ' + (isError ? 'error' : 'ok');
  }

  document.getElementById('abflughafen').addEventListener('change', updateFlugnummer);
  document.getElementById('zielflughafen').addEventListener('change', updateFlugnummer);
  document.getElementById('flugdatum').addEventListener('change', updateFlugnummer);
  document.getElementById('abflugzeit').addEventListener('change', updateFlugnummer);
  document.getElementById('kartennummer').addEventListener('input', zeigeKartenlogo);
  document.getElementById('service').addEventListener('change', berechnePreis);

  document.getElementById('buchungsForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!selected.sitz) { showStatus('Bitte wähle einen Sitzplatz.', true); return; }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Wird gebucht...';

    const payload = {
      vorname: document.getElementById('vorname').value.trim(),
      nachname: document.getElementById('nachname').value.trim(),
      email: document.getElementById('email').value.trim(),
      abflughafen: document.getElementById('abflughafen').value,
      zielflughafen: document.getElementById('zielflughafen').value,
      flugdatum: document.getElementById('flugdatum').value,
      abflugzeit: document.getElementById('abflugzeit').value,
      flugnummer: getFlugnummer(),
      sitzplatz: selected.sitz,
      service: document.getElementById('service').value,
      preis: getPreisWert()
    };

    const { data, error } = await supabaseClient.from('bookings').insert(payload).select().single();

    if (error) {
      if (error.code === '23505') showStatus('Dieser Sitz ist gerade eben von jemand anderem gebucht worden. Bitte wähle einen anderen Sitz.', true);
      else showStatus('Fehler: ' + error.message, true);
      btn.disabled = false; btn.textContent = 'Buchung abschließen';
      await ladeBuchungen();
      return;
    }

    document.getElementById('buchungsDetails').textContent =
`Buchungs-ID: ${data.id}
Name: ${payload.vorname} ${payload.nachname}
E-Mail: ${payload.email}
Abflug: ${payload.abflughafen} -> ${payload.zielflughafen}
Datum/Zeit: ${payload.flugdatum} – ${payload.abflugzeit}
Flugnummer: ${payload.flugnummer}
Sitzplatz: ${payload.sitzplatz}
Zusatzoption: ${payload.service}
Zahlung: **** **** **** ${document.getElementById('kartennummer').value.slice(-4)}
Gesamtpreis: ${payload.preis} €`;

    document.getElementById('buchungsForm').style.display = 'none';
    document.getElementById('buchungsBestaetigung').style.display = 'block';
  });

  generiereAbflugzeiten();
  erstelleSitzplan();
  updateFlugnummer();
</script>
</body>
</html>
